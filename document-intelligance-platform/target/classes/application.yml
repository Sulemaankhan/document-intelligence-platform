spring:
  application:
    name: document-intelligence-platform
  mvc:
    problemdetails:
      enabled: true
  flyway:
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  datasource:
    url: jdbc:mysql://localhost:3306/document-ai
    username: root
    password: 
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

dip:
  storage:
    root: ${DIP_STORAGE_ROOT:./data/uploads}
  ai:
    enabled: ${DIP_AI_ENABLED:true}
    base-url: ${DIP_AI_BASE_URL:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    chat-model: ${DIP_CHAT_MODEL:gpt-4o-mini}
    embedding-model: ${DIP_EMBEDDING_MODEL:text-embedding-3-small}
  chunk:
    size: ${DIP_CHUNK_SIZE:1200}
    overlap: ${DIP_CHUNK_OVERLAP:200}
  ocr:
    enabled: ${DIP_OCR_ENABLED:false}
    dpi: ${DIP_OCR_DPI:300}
    max-pages: ${DIP_OCR_MAX_PAGES:40}
    language: ${DIP_OCR_LANG:eng}
    data-path: ${TESSDATA_PREFIX:}
  rag:
    retrieval-top-k: ${DIP_RAG_TOP_K:12}
    max-context-chars: ${DIP_RAG_MAX_CONTEXT_CHARS:16000}
    answer-temperature: ${DIP_RAG_ANSWER_TEMPERATURE:0.2}

server:
  port: ${SERVER_PORT:8050}

logging:
  level:
    com.dip: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
  show-actuator: false
